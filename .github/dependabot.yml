version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint peers typescript <6.1.0 and TypeScript 7 ships no classic compiler API it can load.
      - dependency-name: typescript
        versions:
          - 7.x
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
