name: Mutation

# Mutation testing (Stryker, SPEC section 4) over the closed module set in stryker.config.mjs. Runs on the owner's
# self-hosted runners like ci.yml, and with the same gate: nothing from a fork or a third party ever executes there.
# It is deliberately NOT part of ci.yml's `gate` (nothing in ci.yml `needs` it): a full run is too slow for every push.
#   * weekly `schedule` (Mondays 06:41 UTC) and manual `workflow_dispatch` on any ref.
#   * `pull_request` only (never `pull_request_target`) from an owner same-repo PR, and only when the PR touches a
#     mutated module: `paths` below is exactly the `mutate` list of stryker.config.mjs (a test asserts they are equal).
# Default token is read-only; no secrets are used.

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [master, main]
    paths:
      - 'scripts/crap/crapScore.ts'
      - 'scripts/ratchet/ratchetCheck.ts'
      - 'scripts/summary/jobSummary.ts'
      - 'src/main/ipc/validate.ts'
      - 'src/main/externalUrlPolicy.ts'
      - 'src/main/windowSecurity.ts'
      - 'src/main/services/s3Url.ts'
      - 'src/main/services/gzipUtils.ts'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: mutation (Stryker, per-module score)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov')
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Mutation tests (whole-run break and per-module score)
        run: npm run mutation

      # Re-judges the JSON report Stryker wrote, so the per-module scores reach the summary even when the step above
      # failed. Its own exit status is ignored: the step above already carries the verdict.
      - name: Per-module scores
        if: always()
        run: |
          {
            echo '### Mutation scores per module'
            echo
            echo '```text'
            npm run --silent mutation -- --check-only 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  # Separate from `mutation` on purpose: job permissions cannot be conditional, so the job a pull request reaches stays
  # read-only and only this one, which a pull request can never run, holds `contents: write`. It adds one commit to
  # the existing gh-pages branch that changes only badges/mutation.json (the Allure report and the other badges are
  # untouched), and shares ci.yml publish's concurrency group so the two never push gh-pages at the same time.
  publish:
    name: Publish the mutation badge to GitHub Pages
    needs: mutation
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-allure-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A mutation run that failed before writing reports/mutation uploads nothing, so this download fails. It must not
      # stop the job: the render and commit steps below still run, and with no mutation.json the badge is published as
      # n/a / lightgrey instead of the previous run's green staying on gh-pages. A run that did write a report keeps
      # its real score (red when below the floor); the score then stays until the next mutation run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: mutation-report
          path: reports/mutation

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      # The renderer writes all ten endpoint files; only mutation.json is kept, the rest of the output is discarded.
      - name: Render the mutation badge
        run: |
          npm run --silent badges -- --out "$RUNNER_TEMP/rendered-badges" --mutation reports/mutation/mutation.json
          cp "$RUNNER_TEMP/rendered-badges/mutation.json" "$RUNNER_TEMP/mutation-badge.json"
          cat "$RUNNER_TEMP/mutation-badge.json"

      - name: Commit badges/mutation.json onto the existing gh-pages branch
        run: |
          git fetch --quiet --depth=1 origin gh-pages
          git checkout --quiet -B gh-pages FETCH_HEAD
          mkdir -p badges
          cp "$RUNNER_TEMP/mutation-badge.json" badges/mutation.json
          git add badges/mutation.json
          if git diff --cached --quiet; then
            echo "badges/mutation.json is unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Mutation badge for ${GITHUB_SHA}"
          git push origin gh-pages
