name: CI

# Runs on the owner's self-hosted runners (int21h-ws, label `s3-browser`).
# Those runners have docker-group access, i.e. effectively root on the host, so
# NOTHING from a fork or a third party may ever execute there:
#   * `pull_request` only (never `pull_request_target`), and each job is gated on
#     the PR head living in THIS repo and being opened by the owner.
#   * Repo setting "Fork pull request workflows" = require approval for all outside collaborators.
#   * Default token is read-only; no secrets are used by these jobs.
# Packaging/release (incl. macOS) stays on GitHub-hosted runners in release.yml.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  quality:
    name: typecheck, lint, unit tests, build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov')
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (src, e2e, configs)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage (thresholds enforced)
        run: npm run test:coverage

      - name: Dependency audit (production deps, high+)
        run: npm run audit:prod

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e (Electron + LocalStack in containers)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov')
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Run Playwright e2e suite in containers
        env:
          CI: 'true'
        run: ./scripts/e2e-docker.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
