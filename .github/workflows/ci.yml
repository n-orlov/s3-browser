name: CI

# Runs on the owner's self-hosted runners (int21h-ws, label `s3-browser`).
# Those runners have docker-group access, i.e. effectively root on the host, so
# NOTHING from a fork or a third party may ever execute there:
#   * `pull_request` only (never `pull_request_target`), and each job is gated on
#     the PR head living in THIS repo and being opened by the owner.
#   * Repo setting "Fork pull request workflows" = require approval for all outside collaborators.
#   * Default token is read-only; no secrets are used by these jobs.
# Packaging/release (incl. macOS) stays on GitHub-hosted runners in release.yml.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  workflow_dispatch:
  # Weekly full run on master (Mondays 05:23 UTC), so a packaging break that no push touched still surfaces.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  quality:
    name: typecheck, lint, unit tests, build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov' &&
       github.event.pull_request.draft == false)
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (src, e2e, configs)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The lint badge shows ESLint's own warning/error count, so the result is also written as JSON. `|| true`: the
      # gate above has already judged the run; this step only records it, and a missing file renders `n/a`.
      - name: ESLint result for the lint badge
        if: ${{ !cancelled() }}
        run: npx eslint . --format json --output-file reports/eslint.json || true

      # `!cancelled()` on the tests and the CRAP score: an earlier red step (typecheck, lint, a failing test)
      # must not stop the unit and coverage evidence the job summary and the report are built from.
      - name: Unit tests with coverage (thresholds enforced)
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: CRAP score gate (complexity x coverage)
        if: ${{ !cancelled() }}
        run: npm run crap

      - name: Quality ratchet (lint ceiling, coverage thresholds)
        run: npm run ratchet:check

      - name: Dependency audit (production deps, high+)
        run: npm run audit:prod

      - name: Build
        run: npm run build

      - name: SBOM (CycloneDX, production dependencies)
        run: npm run sbom

      - name: Job summary (tests, coverage vs thresholds, CRAP)
        if: always()
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/summary/summary.ts quality

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-allure-results
          path: allure-results-unit/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eslint-result
          path: reports/eslint.json
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-junit
          path: junit/junit.xml
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: sbom/sbom.cdx.json
          retention-days: 7

  # Decides whether release-dryrun runs. Push, schedule and manual runs always build it; an owner pull request
  # builds it only when it changes a file that can affect packaging (RELEASE_PATHS, bash globs where `*` also
  # matches `/`). It only diffs two commits with git and runs no repository code, so it uses a GitHub-hosted runner.
  changes:
    name: changes (does this run need the release dry run?)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov' &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Does the pull request touch a packaging path?
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_PATHS: |
            package.json
            build/**
            electron-builder*
            .github/workflows/release.yml
            vite.config.*
            tsconfig*.json
        run: |
          release=false
          if [ "$EVENT_NAME" != "pull_request" ]; then
            release=true
          else
            while IFS= read -r file; do
              while IFS= read -r pattern; do
                # shellcheck disable=SC2053
                if [ -n "$pattern" ] && [[ $file == $pattern ]]; then release=true; fi
              done <<< "$RELEASE_PATHS"
            done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          fi
          echo "release=$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Builds the Linux AppImage with the same commands and Node major as release.yml's build-linux job, but never
  # publishes: read-only token, no release step. A packaging break shows up here, not when a release is cut.
  release-dryrun:
    name: release dry run (Linux AppImage, not published)
    needs: changes
    if: >-
      needs.changes.outputs.release == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'n-orlov' &&
        github.actor == 'n-orlov' &&
        github.event.pull_request.draft == false))
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Linux AppImage (no publish)
        run: |
          npm run build
          npx electron-builder --linux -p never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dryrun-appimage
          path: release/*.AppImage
          retention-days: 7
          if-no-files-found: error

      - name: Smoke-test the AppImage headless (extract, launch under xvfb, window opens)
        run: ./scripts/smoke-appimage.sh

  e2e:
    name: e2e shard ${{ matrix.shard }}/2 (Electron + LocalStack in containers)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov' &&
       github.event.pull_request.draft == false)
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Run Playwright e2e suite in containers
        env:
          CI: 'true'
        run: ./scripts/e2e-docker.sh --shard=${{ matrix.shard }}/2

      - name: Job summary (passed, failed, skipped)
        if: always()
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/summary/summary.ts e2e ${{ matrix.shard }}/2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 14

  report:
    name: Allure report (unit + e2e)
    # `always()` so a red quality or e2e job still produces a report; the same fork/owner gate as the
    # other jobs stays in the condition, because a bare `if: always()` would also run on fork PRs.
    needs: [quality, e2e]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'n-orlov' &&
        github.actor == 'n-orlov' &&
        github.event.pull_request.draft == false))
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The previous published report, only to read its history.jsonl; the branch does not exist before the first publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: previous-pages
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*allure-results*'
          path: allure-input

      - name: Generate one Allure report from the unit and e2e results, with the previous history
        run: |
          mkdir -p allure-report
          if [ -f previous-pages/history.jsonl ]; then cp previous-pages/history.jsonl allure-report/history.jsonl; fi
          npx --yes allure@3.20.1 generate allure-input/* --config scripts/allurerc.mjs --output allure-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  gate:
    name: gate (quality, both e2e shards and, when it runs, release-dryrun succeeded)
    # The single status to protect in branch protection. `if: always()` so it still runs (and fails) when a need
    # failed, was cancelled or was skipped; a skipped need would otherwise skip this job, which reads as passing.
    # It checks out and runs nothing from the repository, so it uses a GitHub-hosted runner and no fork can reach
    # the self-hosted ones through it. The e2e matrix is one need: its result is success only if both shards are.
    # release-dryrun is skipped on a pull request that touches no packaging path, so `skipped` is acceptable for it
    # alone; `changes` (which decides that) must itself succeed, or a broken filter would read as "nothing to build".
    needs: [quality, e2e, changes, release-dryrun]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless quality, every e2e shard and changes succeeded, and release-dryrun succeeded or was skipped
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEASE_DRYRUN_RESULT: ${{ needs.release-dryrun.result }}
        run: |
          status=0
          for pair in "quality=$QUALITY_RESULT" "e2e=$E2E_RESULT" "changes=$CHANGES_RESULT"; do
            echo "${pair%%=*}: ${pair#*=}"
            if [ "${pair#*=}" != "success" ]; then status=1; fi
          done
          echo "release-dryrun: $RELEASE_DRYRUN_RESULT"
          if [ "$RELEASE_DRYRUN_RESULT" != "success" ] && [ "$RELEASE_DRYRUN_RESULT" != "skipped" ]; then status=1; fi
          exit "$status"

  publish:
    name: Publish Allure report to GitHub Pages
    # Separate from `report` on purpose: job permissions cannot be conditional, so the job that runs for pull
    # requests stays read-only and only this one, which never runs for a pull request, holds `contents: write`.
    needs: report
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-allure-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-report
          path: published-report

      # Inputs for the badges. A pattern download matches nothing (and does not fail) when an artifact is missing,
      # and the renderer then writes `n/a` for that badge.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage
        continue-on-error: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-junit
          path: junit
        continue-on-error: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eslint-result
          path: reports
        continue-on-error: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-test-results-*
          path: e2e-results

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Render the shields endpoint badges (badges/*.json)
        run: |
          mkdir -p reports
          npm audit --omit=dev --json > reports/audit.json || true
          # Both shards are named explicitly, whether or not their artifact arrived: the renderer turns a named file
          # that is absent into `n/a`, whereas a loop over the files that exist would silently drop a missing shard
          # and publish the other shard's counts as the whole suite.
          npm run --silent badges -- --out published-badges \
            --e2e e2e-results/e2e-test-results-1/results.json \
            --e2e e2e-results/e2e-test-results-2/results.json

      # The mutation badge is written by the separate mutation workflow, not by this one, and the branch is rebuilt from scratch
      # below, so the previous badge is read back from the last gh-pages commit; before the first mutation run
      # there is none and the `n/a` file stays.
      - name: Carry over the previous badges/mutation.json from gh-pages
        run: |
          if git fetch --quiet --depth=1 origin gh-pages \
            && git show FETCH_HEAD:badges/mutation.json > previous-mutation.json 2> /dev/null; then
            cp previous-mutation.json published-badges/mutation.json
          fi

      # The report directory already holds history.jsonl (previous runs plus this one), so the branch is rebuilt as
      # a single commit each time instead of growing a binary history.
      - name: Push the report and the badges to the gh-pages branch
        run: |
          touch published-report/.nojekyll
          mkdir -p published-report/badges
          cp -a published-badges/. published-report/badges/
          git switch --orphan gh-pages
          git rm -rf --quiet . || true
          cp -a published-report/. .
          rm -rf published-report published-badges previous-mutation.json e2e-results coverage junit reports
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Allure report for ${GITHUB_SHA}"
          git push --force origin gh-pages

      - name: Job summary (link to the published report)
        run: |
          echo "Allure report: https://n-orlov.github.io/s3-browser/" >> "$GITHUB_STEP_SUMMARY"
