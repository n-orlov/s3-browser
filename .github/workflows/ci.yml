name: CI

# Runs on the owner's self-hosted runners (int21h-ws, label `s3-browser`).
# Those runners have docker-group access, i.e. effectively root on the host, so
# NOTHING from a fork or a third party may ever execute there:
#   * `pull_request` only (never `pull_request_target`), and each job is gated on
#     the PR head living in THIS repo and being opened by the owner.
#   * Repo setting "Fork pull request workflows" = require approval for all outside collaborators.
#   * Default token is read-only; no secrets are used by these jobs.
# Packaging/release (incl. macOS) stays on GitHub-hosted runners in release.yml.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  quality:
    name: typecheck, lint, unit tests, build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov')
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (src, e2e, configs)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage (thresholds enforced)
        run: npm run test:coverage

      - name: CRAP score gate (complexity x coverage)
        run: npm run crap

      - name: Quality ratchet (lint ceiling, coverage thresholds)
        run: npm run ratchet:check

      - name: Dependency audit (production deps, high+)
        run: npm run audit:prod

      - name: Build
        run: npm run build

      - name: Job summary (tests, coverage vs thresholds, CRAP)
        if: always()
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/summary/summary.ts quality

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-allure-results
          path: allure-results-unit/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-junit
          path: junit/junit.xml
          retention-days: 7

  e2e:
    name: e2e shard ${{ matrix.shard }}/2 (Electron + LocalStack in containers)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'n-orlov' &&
       github.actor == 'n-orlov')
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Run Playwright e2e suite in containers
        env:
          CI: 'true'
        run: ./scripts/e2e-docker.sh --shard=${{ matrix.shard }}/2

      - name: Job summary (passed, failed, skipped)
        if: always()
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/summary/summary.ts e2e ${{ matrix.shard }}/2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 14

  report:
    name: Allure report (unit + e2e)
    # `always()` so a red quality or e2e job still produces a report; the same fork/owner gate as the
    # other jobs stays in the condition, because a bare `if: always()` would also run on fork PRs.
    needs: [quality, e2e]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'n-orlov' &&
        github.actor == 'n-orlov'))
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The previous published report, only to read its history.jsonl; the branch does not exist before the first publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: previous-pages
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*allure-results*'
          path: allure-input

      - name: Generate one Allure report from the unit and e2e results, with the previous history
        run: |
          mkdir -p allure-report
          if [ -f previous-pages/history.jsonl ]; then cp previous-pages/history.jsonl allure-report/history.jsonl; fi
          npx --yes allure@3.20.1 generate allure-input/* --config scripts/allurerc.mjs --output allure-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  publish:
    name: Publish Allure report to GitHub Pages
    # Separate from `report` on purpose: job permissions cannot be conditional, so the job that runs for pull
    # requests stays read-only and only this one, which never runs for a pull request, holds `contents: write`.
    needs: report
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, s3-browser]
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-allure-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-report
          path: published-report

      # The report directory already holds history.jsonl (previous runs plus this one), so the branch is rebuilt as
      # a single commit each time instead of growing a binary history.
      - name: Push the report to the gh-pages branch
        run: |
          touch published-report/.nojekyll
          git switch --orphan gh-pages
          git rm -rf --quiet . || true
          cp -a published-report/. .
          rm -rf published-report
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Allure report for ${GITHUB_SHA}"
          git push --force origin gh-pages

      - name: Job summary (link to the published report)
        run: |
          echo "Allure report: https://n-orlov.github.io/s3-browser/" >> "$GITHUB_STEP_SUMMARY"
